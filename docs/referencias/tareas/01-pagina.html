		$(document).find(".mostrar-tooltip").tooltip({
				position: {
					my: "center bottom-15",
					at: "center top",
					using: function( position, feedback ) {
						$( this ).css( position );
						$( "<div>" )
						.addClass( "arrow bottom" )
						.addClass( feedback.vertical )
						.addClass( feedback.horizontal )
						.appendTo( this );
					}
				}
			});
		$(document).find(".mostrar-tooltip2").tooltip({
				position: {
					my: "center bottom-15",
					at: "center arrow top",
					using: function( position, feedback ) {
						$( this ).css( position );
						$( "<div>" )
						.addClass( "arrow bottom" )
						.addClass( feedback.vertical )
						.addClass( feedback.horizontal )
						.appendTo( this );
					}
				}
			});
		});
</script>
