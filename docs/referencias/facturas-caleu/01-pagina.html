<script>

function uuidv4() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

let folios = [];
let paymentType = null;
let coms = [];
const adm = "upselling - upselling.kastor.cl";
function removeHash () { 
history.pushState("", document.title, window.location.pathname
                                                   + window.location.search);
}
$(function(){


var formatter = new Intl.NumberFormat('en-US', {
style: 'currency',
currency: 'USD',
minimumFractionDigits: 0,
useGrouping: true
});
const arrayKhipu = {};
let totalAPagarKhipu = 0;
$(".addKhipu").click(function(){
    const data = JSON.parse($(this).val());
    if(!arrayKhipu[data.folionum]) {
        arrayKhipu[data.folionum] = data;
    } else {
        delete arrayKhipu[data.folionum];
    }
    totalAPagarKhipu = 0;
    coms = [];
    folios = [];
    for(var factura in arrayKhipu) {
        const monto = formatter.format(arrayKhipu[factura].doctotal).replace(",",".");
        coms.push(arrayKhipu[factura].cardname);
        folios.push(`Factura: ${arrayKhipu[factura].docnum} - ${monto}`);
        totalAPagarKhipu += +arrayKhipu[factura].doctotal;

    }
    if(totalAPagarKhipu > 0 ) {
        $(".resumenKhipu").css("display","block");
    } else {
        $(".resumenKhipu").css("display","none");
    }
    $(".totalKhipu").html(formatter.format(totalAPagarKhipu).replace(",","."));
    $(".selectPagoKhipu").trigger('change');
});

$(".selectPagoKhipu").change(function(){
    $(".callPagoKhipu").attr('disabled','disabled');
    if(totalAPagarKhipu < 1 ) return;
    const type = $(this).val();
    paymentType = type;
    if(type != '') {
        $(".callPagoKhipu").css('display','none');
        $(".loadingKhipu").css('display','block');
        const url = "https://20200413t104654-dot-kastor-api-khipu-dot-kastor-integraciones.appspot.com/api/v1/fee";
        const dataPayment = {
            amount: parseInt(totalAPagarKhipu),
            type
        };
        const ajax = $.ajax(url, {
        data : JSON.stringify(dataPayment),
        contentType : 'application/json',
        type : 'POST',
        });

        ajax.then(data => {
            console.log(data);
            try {
                if(data && data.status && data.status.code === 200) {
                    $(".totalKhipuComision").html(formatter.format(data.body - totalAPagarKhipu).replace(",","."));
                    $(".totalKhipuFinal").html(formatter.format(data.body).replace(",","."));
                    $(".loadingKhipu").css('display','none');
                    $(".callPagoKhipu").css('display','block');
                    if(data.body > 0) {
                        $(".callPagoKhipu").removeAttr('disabled');
                    }
                } else {
                    throw('error');
                }
            } catch {
                alert('error al obtener el monto a pagar');
            }
        })
    }
    
})


  if (window.location.href.indexOf('#success') > 0) {
    $("#dialog").attr('title','Procesando Pago Khipu');
    $("#dialog").html("<div>El pago esta en proceso de confirmación se te notificara por correo cuando este validado.</div>");
    $("#dialog").dialog({
            modal: true,
            width:"400px",
            buttons:{
            "send":{
                text:'Aceptar',
                "class":"colorNegro",
                click: function() {
                    $("#dialog").dialog('close');
                }
            },
        }
    });
    removeHash();
}

$(".btn-notificar").click(function(){
    $(".text-notificar").val($(this).data('fecha'));
});
$(".enviar-mensaje").click(function(){
    var url = "/login/dashboard/mensaje_facturacion/"+$("#textarea").val();

    $("#textarea").val("");

    $("#dialog").attr('title','Mensaje enviado exitosamente');

}

});

$('.mostrar-pac').click(function()
{
    $("#dialog").attr('title','Contrato PAC');
    $("#dialog").html("<div>Se ha notificado a nuestros ejecutivos comerciales sobre la suscripción al contrato PAC, además se han descargado los contratos para su revisión.</div>");
            

    $("#dialog").dialog({
    modal: true,
    width:"400px",
    buttons:{
    "send":{

          "class":"colorNegro",
          click: function() {
            $("#dialog").dialog('close');
        }
        },
    }
        });
});

//$(document).on("click", ".callPagoKhipu", function() {  
$(".callPagoKhipu").click(function(){
    const url = "https://20200413t104654-dot-kastor-api-khipu-dot-kastor-integraciones.appspot.com/api/v1/payments";
    const dataPayment = {
        subject: "Pago Facturas "+adm,
        amount: parseInt(totalAPagarKhipu),
        transaction_id: uuidv4(),
        type: "CALEU",
        data: { comunidades: coms.join(", "), administracion: adm, folionum: folios.join(", "), doctotal: totalAPagarKhipu},
        cancel_url: window.location.href,
        return_url: window.location.href + "#success",
        paymentType: paymentType
    };
    const ajax = $.ajax(url, {
    data : JSON.stringify(dataPayment),
    contentType : 'application/json',
    type : 'POST',
    });

    ajax.then(data => {
        try {
            if(data && data.status && data.status.code === 200) {
                window.location.href = data.body.khipu.payment_url;
            } else {
                throw('error');
            }
        } catch {
            alert('error al crear el pago');
        }
    })
});
});

.container-chekbox {

/* Hide the browser's default checkbox */
.container-chekbox input {
position: absolute;
opacity: 0;
cursor: pointer;
height: 0;
width: 0;
}

/* Create a custom checkbox */
.checkmark {
position: absolute;
top: 0;
left: 0;
height: 25px;
width: 25px;
background-color: #eee;
}

/* On mouse-over, add a grey background color */
.container-chekbox:hover input ~ .checkmark {
background-color: #ccc;
}

/* When the checkbox is checked, add a blue background */
.container-chekbox input:checked ~ .checkmark {
background-color: #2196F3;
}

/* Create the checkmark/indicator (hidden when not checked) */
.checkmark:after {
content: "";
position: absolute;
display: none;
}

/* Show the checkmark when checked */
.container-chekbox input:checked ~ .checkmark:after {
display: block;
}

/* Style the checkmark/indicator */
.container-chekbox .checkmark:after {
left: 9px;
top: 5px;
width: 5px;
height: 10px;
border: solid white;
border-width: 0 3px 3px 0;
-webkit-transform: rotate(45deg);

}
